/* ============ Hooks utilitarios ============ */

function useHashRoute() {
  function parse() {
    const hash = window.location.hash.replace(/^#\/?/, "");
    const parts = hash.split("/").filter(Boolean);
    return { page: parts[0] || "inicio", target: parts[1] || null };
  }
  const [route, setRoute] = useState(parse);
  useEffect(() => {
    function onHashChange() { setRoute(parse()); }
    window.addEventListener("hashchange", onHashChange);
    return () => window.removeEventListener("hashchange", onHashChange);
  }, []);
  return route;
}

function useScrollY() {
  const [y, setY] = useState(window.scrollY);
  useEffect(() => {
    function onScroll() { setY(window.scrollY); }
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return y;
}

function useInView(options) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    if (!ref.current || !("IntersectionObserver" in window)) { setInView(true); return; }
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) { setInView(true); obs.unobserve(entry.target); }
      });
    }, options || { threshold: 0.25 });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

function useCountUp(target, active, duration) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    if (!active) return;
    let startTs = null, raf;
    function tick(ts) {
      if (!startTs) startTs = ts;
      const progress = Math.min((ts - startTs) / (duration || 1200), 1);
      setValue(Math.floor(progress * target));
      if (progress < 1) raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [active]);
  return value;
}

function HeroCarousel() {
  const [index, setIndex] = useState(0);
  const timerRef = useRef(null);

  function stop() { if (timerRef.current) clearInterval(timerRef.current); }
  function start() { stop(); timerRef.current = setInterval(() => setIndex((i) => (i + 1) % HERO_SLIDES.length), 6500); }
  useEffect(() => { start(); return stop; }, []);
  function goTo(i) { setIndex((i + HERO_SLIDES.length) % HERO_SLIDES.length); start(); }

  const slide = HERO_SLIDES[index];
  return (
    <section className="hero" onMouseEnter={stop} onMouseLeave={start}>
      <HeroShapes/>
      <div className="container hero-inner">
        <div className="hero-carousel">
          <div className="hero-slide is-active" key={index}>
            <span className="eyebrow">{slide.eyebrow}</span>
            <h1>{slide.title}</h1>
            <p className="hero-lead">{slide.lead}</p>
            <div className="hero-actions">
              <a className="btn-primary" href={slide.primary.href}>{slide.primary.label}</a>
              <a className="btn-secondary" href={slide.secondary.href}>{slide.secondary.label}</a>
            </div>
          </div>
        </div>
        <div className="hero-controls">
          <button className="hero-arrow" onClick={() => goTo(index - 1)} aria-label="Diapositiva anterior"><IconChevronLeft/></button>
          <div className="hero-dots">
            {HERO_SLIDES.map((_, i) => (
              <button key={i} className={"hero-dot" + (i === index ? " is-active" : "")} onClick={() => goTo(i)} aria-label={"Ir a la diapositiva " + (i + 1)}/>
            ))}
          </div>
          <button className="hero-arrow" onClick={() => goTo(index + 1)} aria-label="Siguiente diapositiva"><IconChevronRight/></button>
        </div>
        <StatsRow/>
      </div>
    </section>
  );
}

          ))}
        </div>
      </div>

}

function HomePage({ onSectionChange }) {
  useEffect(() => {
    if (!("IntersectionObserver" in window)) return;
    const targets = [
      { id: "hero", el: document.querySelector(".hero") },
      { id: "productos", el: document.getElementById("productos") },
      { id: "sostenibilidad", el: document.getElementById("sostenibilidad") }
    ].filter((t) => t.el);
    if (!targets.length) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          const match = targets.find((t) => t.el === entry.target);
          if (match) onSectionChange(match.id);
        }
      });
    }, { rootMargin: "-100px 0px -55% 0px", threshold: 0 });
    targets.forEach((t) => obs.observe(t.el));
    return () => obs.disconnect();
  }, []);

  return (
    <React.Fragment>
      <HeroCarousel/>
      <AboutTeaser/>
      <ProductsGrid/>
      <ImpactChecklist/>
      <CtaBanner title="¿Quieres conocer más sobre INJIBOA?" text="Escríbenos y con gusto atenderemos tu consulta." ctaLabel="Contáctanos" ctaHref="#/contacto"/>
    </React.Fragment>
  );
}

/* ============ Página Contacto ============ */

function ContactForm() {
  const [values, setValues] = useState({ nombre: "", correo: "", telefono: "", asunto: "Información general", mensaje: "" });
  const [errors, setErrors] = useState({});
  const [submitted, setSubmitted] = useState(false);

  function update(field, val) {
    setValues((v) => ({ ...v, [field]: val }));
    if (errors[field]) setErrors((e) => ({ ...e, [field]: null }));
  }
  function validate(v) {
    const errs = {};
    if (!v.nombre.trim()) errs.nombre = "Ingresa tu nombre.";
    if (!v.correo.trim() || v.correo.indexOf("@") === -1) errs.correo = "Ingresa un correo válido.";
    if (!v.mensaje.trim()) errs.mensaje = "Escribe tu mensaje.";
    return errs;
  }
  function handleSubmit(e) {
    e.preventDefault();
    const errs = validate(values);
    setErrors(errs);
    if (Object.keys(errs).length === 0) setSubmitted(true);
  }

  if (submitted) {
    return (
      <div className="success-box is-visible">
        <div className="success-icon"><IconCheck size={26}/></div>
        <h3>¡Gracias por escribirnos!</h3>
        <p>Hemos recibido tu mensaje. Nuestro equipo se pondrá en contacto contigo pronto.</p>
      </div>
    );
  }

  return (
    <form onSubmit={handleSubmit} noValidate>
      <h2>Envíanos un mensaje</h2>
      <div className="form-row">
        <div className="form-field">
          <label htmlFor="nombre">Nombre completo</label>
          <input type="text" id="nombre" className={errors.nombre ? "has-error" : ""} value={values.nombre} onChange={(e) => update("nombre", e.target.value)} placeholder="Tu nombre"/>
          <p className={"error-text" + (errors.nombre ? " is-visible" : "")}>{errors.nombre || "Ingresa tu nombre."}</p>
        </div>
        <div className="form-field">
          <label htmlFor="correo">Correo electrónico</label>
          <input type="email" id="correo" className={errors.correo ? "has-error" : ""} value={values.correo} onChange={(e) => update("correo", e.target.value)} placeholder="tucorreo@ejemplo.com"/>
          <p className={"error-text" + (errors.correo ? " is-visible" : "")}>{errors.correo || "Ingresa un correo válido."}</p>
        </div>
      </div>
      <div className="form-row">
        <div className="form-field">
          <label htmlFor="telefono">Teléfono (opcional)</label>
          <input type="tel" id="telefono" value={values.telefono} onChange={(e) => update("telefono", e.target.value)} placeholder="+503 0000-0000"/>
        </div>
        <div className="form-field">
          <label htmlFor="asunto">Asunto</label>
          <select id="asunto" value={values.asunto} onChange={(e) => update("asunto", e.target.value)}>
            <option>Información general</option>
            <option>Recursos humanos</option>
            <option>Proveedores</option>
            <option>Otro</option>
          </select>
        </div>
      </div>
      <div className="form-field">
        <label htmlFor="mensaje">Mensaje</label>
        <textarea rows="5" id="mensaje" className={errors.mensaje ? "has-error" : ""} value={values.mensaje} onChange={(e) => update("mensaje", e.target.value)} placeholder="Cuéntanos en qué podemos ayudarte" maxLength={600}></textarea>
        <div className="field-meta">
          <p className={"error-text" + (errors.mensaje ? " is-visible" : "")}>{errors.mensaje || "Escribe tu mensaje."}</p>
          <span className="char-count">{values.mensaje.length}/600</span>
        </div>
      </div>
      <button type="submit" className="btn-primary">Enviar mensaje</button>
    </form>
  );
}

/* ============ App raíz (con "router" por hash) ============ */

function App() {
  const route = useHashRoute();
  const [mobileOpen, setMobileOpen] = useState(false);
  const [activeSection, setActiveSection] = useState(route.target || "hero");

  useEffect(() => {
    if (route.page === "inicio") setActiveSection(route.target || "hero");
  }, [route.page, route.target]);

  useEffect(() => {
    if (route.target) {
      const el = document.getElementById(route.target);
      if (el) {
        const t = setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
        return () => clearTimeout(t);
      }
    } else {
      window.scrollTo(0, 0);
    }
  }, [route.page, route.target]);

  let page;
  if (route.page === "nosotros") page = <NosotrosPage/>;
  else if (route.page === "contacto") page = <ContactoPage/>;
  else page = <HomePage onSectionChange={setActiveSection}/>;

  return (
    <React.Fragment>
      <UtilityBar/>
      <Header route={route} activeSection={activeSection} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}/>
      <div key={route.page} className="page-transition">{page}</div>
      <Footer/>
      <BackToTop/>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

</script>
